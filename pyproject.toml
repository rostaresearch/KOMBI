[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kombi"
version = "0.1.0"
description = "Kinetics-Optimized Markovian Bias Integration: enhanced sampling via MFPT minimisation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Tiejun Wei" },
    { name = "Balint Dudas" },
    { name = "Edina Rosta", email = "e.rosta@ucl.ac.uk" },
]
keywords = ["enhanced sampling", "Markov state models", "molecular dynamics", "DHAM", "MFPT"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
md = [
    "openmm>=8.0",
    "mdtraj>=1.9",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "black>=24.0",
]

[project.scripts]
kombi = "kombi.cli:main"

[project.urls]
Homepage = "https://github.com/rostaresearch/KOMBI"
Repository = "https://github.com/rostaresearch/KOMBI"
"Bug Tracker" = "https://github.com/rostaresearch/KOMBI/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "NPY", # numpy-specific
]
ignore = [
    "E501",  # line length handled by black
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q"
